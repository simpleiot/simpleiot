<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="#ffffff"/>

  <!-- Raspberry Pi 5 -->
  <rect x="20" y="20" width="340" height="280" rx="16" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="40" y="52" font-size="16" font-weight="bold" fill="#333">🍓 Raspberry Pi 5</text>
  <text x="40" y="72" font-size="12" fill="#555">siot edge instance</text>

  <!-- push button -->
  <g transform="translate(95,120)">
    <line x1="-45" y1="0" x2="-22" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="22" y1="0" x2="45" y2="0" stroke="#333" stroke-width="2"/>
    <circle cx="-22" cy="0" r="3.5" fill="#333"/>
    <circle cx="22" cy="0" r="3.5" fill="#333"/>
    <line x1="-26" y1="-14" x2="26" y2="-14" stroke="#333" stroke-width="2.5"/>
    <line x1="0" y1="-14" x2="0" y2="-30" stroke="#333" stroke-width="2.5"/>
    <line x1="-10" y1="-30" x2="10" y2="-30" stroke="#333" stroke-width="2.5"/>
    <text x="0" y="28" font-size="12" text-anchor="middle" fill="#333">Push button</text>
    <text x="0" y="44" font-size="11" text-anchor="middle" fill="#555">GPIO17 · pin 11</text>
  </g>

  <!-- LED -->
  <g transform="translate(95,240)">
    <line x1="-45" y1="0" x2="-14" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="14" y1="0" x2="45" y2="0" stroke="#333" stroke-width="2"/>
    <path d="M14,-14 L14,14 L-14,0 z" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
    <line x1="-14" y1="-14" x2="-14" y2="14" stroke="#b85450" stroke-width="2.5"/>
    <path d="M-2,-18 L-12,-30 M-12,-30 L-12,-24 M-12,-30 L-6,-30" stroke="#b85450" stroke-width="1.5" fill="none"/>
    <path d="M8,-18 L-2,-30 M-2,-30 L-2,-24 M-2,-30 L4,-30" stroke="#b85450" stroke-width="1.5" fill="none"/>
    <text x="0" y="32" font-size="12" text-anchor="middle" fill="#333">💡 LED + 330 Ω</text>
    <text x="0" y="48" font-size="11" text-anchor="middle" fill="#555">GPIO27 · pin 13</text>
  </g>

  <!-- siot nodes on the Pi -->
  <rect x="200" y="92" width="140" height="56" rx="10" fill="#ffffff" stroke="#82b366" stroke-width="1.5"/>
  <text x="270" y="116" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Test switch</text>
  <text x="270" y="134" font-size="11" text-anchor="middle" fill="#555">gpio input · value</text>

  <rect x="200" y="212" width="140" height="56" rx="10" fill="#ffffff" stroke="#82b366" stroke-width="1.5"/>
  <text x="270" y="236" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">Test LED</text>
  <text x="270" y="254" font-size="11" text-anchor="middle" fill="#555">gpio output · valueSet</text>

  <!-- wires -->
  <line x1="140" y1="120" x2="198" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="240" x2="142" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="171" y="230" font-size="11" text-anchor="middle" fill="#333">③ drive</text>

  <!-- siot3 server -->
  <path d="M540,300 H850 C890,300 902,240 872,215 C898,168 866,118 826,128 C816,68 750,52 714,82 C690,22 598,22 578,78 C540,52 492,84 508,128 C468,140 466,200 503,215 C468,242 490,300 540,300 Z" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="646" y="72" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">siot3 server</text>
  <text x="646" y="90" font-size="12" text-anchor="middle" fill="#555">siot.bec-systems.com</text>

  <rect x="560" y="200" width="260" height="80" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/>
  <text x="690" y="232" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">⚙️ LED follows switch (server)</text>
  <text x="690" y="254" font-size="12" text-anchor="middle" fill="#555">switch pressed → LED on</text>
  <text x="690" y="270" font-size="12" text-anchor="middle" fill="#555">switch released → LED off</text>

  <!-- data flow over sync -->
  <path d="M340,120 H690 V198" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="575" y="110" font-size="12" text-anchor="middle" fill="#333">① switch value</text>

  <path d="M560,240 H342" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="258" font-size="12" text-anchor="middle" fill="#333">② LED valueSet</text>

  <rect x="325" y="167" width="180" height="26" rx="13" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="415" y="184" font-size="12" text-anchor="middle" fill="#333">🔒 sync · NATS TLS</text>

  <!-- browser -->
  <path d="M190,302 V390 H368" fill="none" stroke="#333" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="208" y="372" width="124" height="36" rx="12" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="270" y="387" font-size="11" text-anchor="middle" fill="#333">NATS · WebSocket</text>
  <text x="270" y="401" font-size="11" text-anchor="middle" fill="#333">over local network</text>

  <path d="M700,302 V390 H532" fill="none" stroke="#333" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="568" y="372" width="124" height="36" rx="12" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="630" y="387" font-size="11" text-anchor="middle" fill="#333">NATS · WebSocket</text>
  <text x="630" y="401" font-size="11" text-anchor="middle" fill="#333">over HTTPS</text>

  <rect x="370" y="360" width="160" height="60" rx="10" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <path d="M370,370 a10,10 0 0 1 10,-10 h140 a10,10 0 0 1 10,10 v4 h-160 z" fill="#e8e8e8"/>
  <line x1="370" y1="374" x2="530" y2="374" stroke="#666" stroke-width="1"/>
  <circle cx="382" cy="367" r="3" fill="#f8cecc" stroke="#b85450"/>
  <circle cx="393" cy="367" r="3" fill="#fff2cc" stroke="#d6b656"/>
  <circle cx="404" cy="367" r="3" fill="#d5e8d4" stroke="#82b366"/>
  <text x="450" y="403" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">🖥️ Browser</text>

  <!-- latency -->
  <rect x="20" y="440" width="860" height="40" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="450" y="465" font-size="13" text-anchor="middle" fill="#333">⏱ Round trip = Test LED value time − Test switch value time (both stamped by the Pi)</text>
</svg>
