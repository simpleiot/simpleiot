        - file:
            description: Site logo
            name: logo.svg
            data: |
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
                <rect width="200" height="60" rx="10" fill="#1d3557" />
                <circle cx="32" cy="30" r="16" fill="none" stroke="#a8dadc" stroke-width="5" />
                <circle cx="32" cy="30" r="5" fill="#a8dadc" />
                <text x="62" y="39" font-family="sans-serif" font-size="24"
                  font-weight="600" fill="#f1faee">Creek Site</text>
              </svg>
        # a drawing with bindings, for the test values in its node's settings;
        # no dashboard uses it
        - file:
            description: Level drawing
            name: level.svg
            data: |
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170">
                <style>
                  .lamp { fill: #ccc; }
                  .lamp[data-siot-state="on"] { fill: #e63946; }
                  .lamp[data-siot-state="stale"] { fill: #eee; }
                </style>
                <rect x="20" y="10" width="50" height="130" fill="none" stroke="#555" stroke-width="3" />
                <rect x="22" y="12" width="46" height="126" fill="#4a90d9"
                  data-siot-bind="level" data-siot-level />
                <text x="45" y="162" text-anchor="middle" font-family="sans-serif" font-size="16"
                  data-siot-bind="level" data-siot-text data-siot-decimals="0">0</text>
                <circle class="lamp" cx="95" cy="25" r="12"
                  data-siot-bind="alarm" data-siot-toggle />
              </svg>

        # ---- the canvas: the site plan behind the equipment
        - dashboard:
            description: Site layers
            layout: canvas
            canvasWidth: 800
            canvasHeight: 400
            children:
              - widget:
                  description: Site
                  component: image
                  x: 0
                  y: 0
                  w: 800
                  z: -1
                  bindNode:
                    image: Site plan
              - widget:
                  description: Site pump
                  component: pump
                  x: 120
                  y: 190
                  w: 110
                  z: 1
                  bindNode:
                    running: Pump run
              - widget:
                  description: Site tank
                  component: tank
                  x: 430
                  y: 60
                  w: 230
                  z: 1
                  bindNode:
                    level: Site tank level
                    temp: Site tank temperature
              - link:
                  description: Site pump to tank
                  from: Site pump.discharge
                  to: Site tank.left
                  routing: orthogonal
                  bindNode:
                    flowing: Pump run
              # readings drawn over the tank, each on a card
              - widget:
                  description: Site level
                  component: value
                  x: 485
                  y: 150
                  w: 120
                  z: 2
                  bindNode:
                    value: Site tank level
                  prop:
                    unit: "%"
                    decimals: "1"
                    background: "on"
              - widget:
                  description: Site temperature
                  component: value
                  x: 485
                  y: 240
                  w: 120
                  z: 2
                  bindNode:
                    value: Site tank temperature
                  prop:
                    unit: °C
                    decimals: "1"
                    background: "#ffffffcc"
              - widget:
                  description: Site pump switch
                  component: status
                  x: 85
                  y: 300
                  w: 160
                  z: 2
                  bindNode:
                    value: Pump run
                  prop:
                    on: Running
                    off: Stopped
                    background: "on"
              # two overlapping cards to try the stacking buttons on
              - widget:
                  description: Back card
                  component: value
                  x: 40
                  y: 30
                  w: 200
                  z: 3
                  bindNode:
                    value: Site note
                  prop:
                    background: lightyellow
              - widget:
                  description: Front card
                  component: value
                  x: 110
                  y: 75
                  w: 160
                  z: 4
                  bindNode:
                    value: Site tank level
                  prop:
                    unit: "%"
                    decimals: "0"
                    background: lightblue
              - widget:
                  description: Logo
                  component: image
                  x: 300
                  y: 348
                  w: 160
                  z: 5
                  bindNode:
                    image: Site logo
                  prop:
                    opacity: "0.8"

        # ---- the grid: how an image fills a tile
        - dashboard:
            description: Image tiles
            layout: grid
            cols: 12
            children:
              - widget:
                  description: Fit contain
                  component: image
                  x: 0
                  y: 0
                  w: 4
                  h: 3
                  bindNode:
                    image: Site plan
                  prop:
                    fit: contain
              - widget:
                  description: Fit cover
                  component: image
                  x: 4
                  y: 0
                  w: 4
                  h: 3
                  bindNode:
                    image: Site plan
                  prop:
                    fit: cover
              - widget:
                  description: Fit stretch
                  component: image
                  x: 8
                  y: 0
                  w: 4
                  h: 3
                  bindNode:
                    image: Site plan
                  prop:
                    fit: stretch
              - widget:
                  description: Faded
                  component: image
                  x: 0
                  y: 3
                  w: 4
                  h: 3
                  bindNode:
                    image: Site plan
                  prop:
                    opacity: "0.4"
              - widget:
                  description: Logo tile
                  component: image
                  x: 4
                  y: 3
                  w: 4
                  h: 2
                  bindNode:
                    image: Site logo
