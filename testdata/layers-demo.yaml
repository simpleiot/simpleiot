# A layers demo: images, stacking order, and widget backgrounds, under one
# group. Load it into a running instance with:
#
#   siot import < testdata/layers-demo.yaml
#
# Then open Dashboards in the web UI. Where each feature is:
#
#   image widget             Site layers: a site plan uploaded as a binary
#                            PNG fills the canvas; Image tiles shows it in
#                            grid tiles
#   image as background      the site plan has z -1, so the link, the
#                            equipment, and the readings draw over it
#   z-order                  the readings over the tank have a higher z than
#                            the tank; Back card and Front card overlap so
#                            the stacking buttons in edit mode can be tried
#   background option        the tank readings and the pump switch draw on
#                            a card (on, and a color with alpha); Front card
#                            and Back card use named colors
#   SVG as an image          Site logo is an SVG file drawn by the image
#                            widget, at opacity 0.8 on the road
#   fit and opacity          Image tiles: the site plan with fit contain,
#                            cover, and stretch, and one faded to 0.4
#   file previews            open Site plan or Site logo in Nodes to see the
#                            image in the node's settings; open Level
#                            drawing to try its bindings with test values
#
# Widget bindings name their node by description, and link ends name a
# widget by its description, so the file reads as the dashboard looks.
apiVersion: 1
nodes:
  - group:
      description: Layers demo
      children:
        # ---- what the widgets show
        - variable:
            description: Pump run
            variableType: onOff
            value: 1
        - variable:
            description: Site note
            variableType: text
            value: Tue 9:00
        - signalGenerator:
            description: Site tank level
            signalType: random walk
            units: "%"
            minValue: 20
            maxValue: 90
            initialValue: 60
            minIncrement: -1
            maxIncrement: 1
            sampleRate: 1
            roundTo: 0.1
        - signalGenerator:
            description: Site tank temperature
            signalType: random walk
            units: °C
            minValue: 15
            maxValue: 30
            initialValue: 21
            minIncrement: -0.2
            maxIncrement: 0.2
            sampleRate: 1
            roundTo: 0.1

