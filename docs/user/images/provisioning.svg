<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Provisioning applies files from a directory and uploaded file nodes, creates nodes, and records what it applied under the provisioning node">
  <!-- Simple IoT diagram style: see docs/ref/documentation.md (Diagrams). -->
  <style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #5f5f5f; --line: #3a3a3a;
    --blue: #dae8fc; --blue-s: #6c8ebf;
    --green: #d5e8d4; --green-s: #82b366;
    --yellow: #fff2cc; --yellow-s: #d6b656;
    --purple: #e1d5e7; --purple-s: #9673a6;
    --orange: #ffe6cc; --orange-s: #d79b00;
    --red: #f8cecc; --red-s: #b85450;
    --gray: #f5f5f5; --gray-s: #9a9a9a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --fg: #f0f0f0; --muted: #a8a8a8; --line: #c8c8c8;
      --blue: #1e2a3d; --green: #1f3320; --yellow: #38321c;
      --purple: #2f2538; --orange: #3d2a14; --red: #3d1f1f;
      --gray: #242424; --gray-s: #5a5a5a;
    }
  }
  svg { font-family: Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: var(--bg); }
  text { fill: var(--fg); font-size: 12px; dominant-baseline: central; }
  .title { font-size: 14px; font-weight: 600; dominant-baseline: auto; }
  .small { font-size: 11px; }
  .muted { fill: var(--muted); }
  .bold { font-weight: 600; }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; }
  .shape { stroke-width: 1.2; }
  .blue { fill: var(--blue); stroke: var(--blue-s); }
  .green { fill: var(--green); stroke: var(--green-s); }
  .yellow { fill: var(--yellow); stroke: var(--yellow-s); }
  .purple { fill: var(--purple); stroke: var(--purple-s); }
  .orange { fill: var(--orange); stroke: var(--orange-s); }
  .red { fill: var(--red); stroke: var(--red-s); }
  .gray { fill: var(--gray); stroke: var(--gray-s); }
  .dashed { stroke-dasharray: 5 4; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; }
  .edge.c-blue { stroke: var(--blue-s); }
  .edge.c-green { stroke: var(--green-s); }
  .edge.c-purple { stroke: var(--purple-s); }
  .edge.c-orange { stroke: var(--orange-s); }
  .edge.c-red { stroke: var(--red-s); }
  .head { fill: var(--line); }
  .head.c-blue { fill: var(--blue-s); }
  .head.c-green { fill: var(--green-s); }
  .head.c-purple { fill: var(--purple-s); }
  .head.c-orange { fill: var(--orange-s); }
  .head.c-red { fill: var(--red-s); }
  .actor { fill: none; stroke: var(--fg); stroke-width: 1.5; }
  .label-bg { fill: var(--bg); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-green" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="900" height="440" rx="8"/>
  <rect class="shape gray" x="20" y="20" width="300" height="290" rx="10"/>
  <text class="title" x="32" y="42">🗂️ Files</text>
  <rect class="shape yellow" x="40" y="60" width="260" height="70" rx="6"/>
  <text x="170" y="81" text-anchor="middle">Provisioning directory</text>
  <text text-anchor="middle" class="small muted"><tspan x="170" y="95.5">10-site.yaml</tspan><tspan x="170" y="109.5">20-devices.yaml</tspan></text>
  <text x="40" y="146" text-anchor="start" class="small muted">① applied first, in name order</text>
  <rect class="shape green" x="40" y="176" width="260" height="56" rx="6"/>
  <text x="170" y="197" text-anchor="middle">Uploaded file nodes</text>
  <text x="170" y="211.5" text-anchor="middle" class="small muted">added in the UI</text>
  <text x="40" y="248" text-anchor="start" class="small muted">② applied next, oldest first</text>
  <text text-anchor="start" class="small muted"><tspan x="40" y="272.5">Uploads record their status on</tspan><tspan x="40" y="287.5">their own file node.</tspan></text>
  <rect class="shape blue" x="370" y="130" width="170" height="64" rx="6"/>
  <text x="455" y="148" text-anchor="middle">Provisioning</text>
  <text text-anchor="middle" class="small muted"><tspan x="455" y="162.5">at start-up and</tspan><tspan x="455" y="176.5">when a file changes</tspan></text>
  <path class="edge" d="M300,95 L345,95 L345,148 L370,148" marker-end="url(#arrow)"/>
  <path class="edge" d="M300,204 L345,204 L345,176 L370,176" marker-end="url(#arrow)"/>
  <rect class="shape gray" x="590" y="20" width="290" height="290" rx="10"/>
  <text class="title" x="602" y="42">🌳 Node tree</text>
  <rect class="shape green" x="610" y="56" width="90" height="36" rx="6"/>
  <text x="655" y="74" text-anchor="middle">root</text>
  <rect class="shape green" x="700" y="110" width="165" height="50" rx="6"/>
  <text x="782.5" y="128" text-anchor="middle">Nodes from files</text>
  <text x="782.5" y="142.5" text-anchor="middle" class="small muted">groups, devices, …</text>
  <rect class="shape green" x="700" y="178" width="165" height="36" rx="6"/>
  <text x="782.5" y="196" text-anchor="middle" class="mono">provisioning</text>
  <rect class="shape green" x="728" y="236" width="142" height="50" rx="6"/>
  <text x="799" y="254" text-anchor="middle" class="mono">provisioningFile</text>
  <text x="799" y="268.5" text-anchor="middle" class="small muted">name, checksum, error</text>
  <path class="edge" d="M655,92 L655,196 L700,196"/>
  <path class="edge" d="M655,135 L700,135"/>
  <path class="edge" d="M715,214 L715,261 L728,261"/>
  <path class="edge" d="M540,135 L700,135" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="539.45" y="119" width="53.1" height="32" rx="3"/>
  <text text-anchor="middle" class="small"><tspan x="566" y="128">creates,</tspan><tspan x="566" y="142">updates</tspan></text>
  <path class="edge" d="M540,182 L604,182 L604,296 L799,296 L799,286" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="579.21" y="231" width="49.58" height="18" rx="3"/>
  <text x="604" y="240" text-anchor="middle" class="small">records</text>
  <rect class="shape gray dashed" x="20" y="330" width="520" height="96" rx="10"/>
  <text class="title" x="32" y="352">🔍 Before applying</text>
  <rect class="shape blue" x="36" y="366" width="240" height="48" rx="6"/>
  <text x="156" y="383" text-anchor="middle" class="mono">siot provision -dir … -check</text>
  <text x="156" y="397.5" text-anchor="middle" class="small muted">parses only, no instance needed</text>
  <rect class="shape blue" x="288" y="366" width="236" height="48" rx="6"/>
  <text x="406" y="383" text-anchor="middle" class="mono">siot provision -dir …</text>
  <text x="406" y="397.5" text-anchor="middle" class="small muted">prints what would change</text>
</svg>
