<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="Ways to get PLC data into Simple IoT: Modbus, MQTT through a gateway, Sparkplug B, planned OPC UA and EtherNet/IP clients, or a process of your own over NATS">
  <!-- Simple IoT diagram style: see docs/ref/documentation.md (Diagrams). -->
  <style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #5f5f5f; --line: #3a3a3a;
    --blue: #dae8fc; --blue-s: #6c8ebf;
    --green: #d5e8d4; --green-s: #82b366;
    --yellow: #fff2cc; --yellow-s: #d6b656;
    --purple: #e1d5e7; --purple-s: #9673a6;
    --orange: #ffe6cc; --orange-s: #d79b00;
    --red: #f8cecc; --red-s: #b85450;
    --gray: #f5f5f5; --gray-s: #9a9a9a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --fg: #f0f0f0; --muted: #a8a8a8; --line: #c8c8c8;
      --blue: #1e2a3d; --green: #1f3320; --yellow: #38321c;
      --purple: #2f2538; --orange: #3d2a14; --red: #3d1f1f;
      --gray: #242424; --gray-s: #5a5a5a;
    }
  }
  svg { font-family: Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: var(--bg); }
  text { fill: var(--fg); font-size: 12px; dominant-baseline: central; }
  .title { font-size: 14px; font-weight: 600; dominant-baseline: auto; }
  .small { font-size: 11px; }
  .muted { fill: var(--muted); }
  .bold { font-weight: 600; }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; }
  .shape { stroke-width: 1.2; }
  .blue { fill: var(--blue); stroke: var(--blue-s); }
  .green { fill: var(--green); stroke: var(--green-s); }
  .yellow { fill: var(--yellow); stroke: var(--yellow-s); }
  .purple { fill: var(--purple); stroke: var(--purple-s); }
  .orange { fill: var(--orange); stroke: var(--orange-s); }
  .red { fill: var(--red); stroke: var(--red-s); }
  .gray { fill: var(--gray); stroke: var(--gray-s); }
  .dashed { stroke-dasharray: 5 4; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; }
  .edge.c-blue { stroke: var(--blue-s); }
  .edge.c-green { stroke: var(--green-s); }
  .edge.c-purple { stroke: var(--purple-s); }
  .edge.c-orange { stroke: var(--orange-s); }
  .edge.c-red { stroke: var(--red-s); }
  .head { fill: var(--line); }
  .head.c-blue { fill: var(--blue-s); }
  .head.c-green { fill: var(--green-s); }
  .head.c-purple { fill: var(--purple-s); }
  .head.c-orange { fill: var(--orange-s); }
  .head.c-red { fill: var(--red-s); }
  .actor { fill: none; stroke: var(--fg); stroke-width: 1.5; }
  .label-bg { fill: var(--bg); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-green" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="880" height="430" rx="8"/>
  <rect class="shape orange" x="20" y="175" width="120" height="64" rx="6"/>
  <text x="80" y="193" text-anchor="middle">🏭 PLC</text>
  <text text-anchor="middle" class="small muted"><tspan x="80" y="207.5">Logix, Siemens,</tspan><tspan x="80" y="221.5">Beckhoff, …</tspan></text>
  <rect class="shape gray" x="610" y="16" width="250" height="400" rx="10"/>
  <text class="title" x="622" y="38">📦 Simple IoT</text>
  <rect class="shape blue" x="630" y="56" width="210" height="46" rx="6"/>
  <text x="735" y="79" text-anchor="middle">Modbus client</text>
  <rect class="shape purple" x="200" y="56" width="170" height="46" rx="6"/>
  <text x="285" y="72" text-anchor="middle">Modbus server</text>
  <text x="285" y="86.5" text-anchor="middle" class="small muted">add-on, module, or gateway</text>
  <path class="edge" d="M140,207 L200,79"/>
  <path class="edge" d="M370,79 L630,79" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="476.475" y="70" width="47.05" height="18" rx="3"/>
  <text x="500" y="79" text-anchor="middle" class="small">Modbus</text>
  <rect class="shape blue" x="630" y="116" width="210" height="46" rx="6"/>
  <text x="735" y="132" text-anchor="middle">MQTT client</text>
  <text x="735" y="146.5" text-anchor="middle" class="small muted">built-in broker</text>
  <rect class="shape purple" x="200" y="116" width="170" height="46" rx="6"/>
  <text x="285" y="132" text-anchor="middle">Gateway</text>
  <text x="285" y="146.5" text-anchor="middle" class="small muted">Kepware, Ignition, …</text>
  <path class="edge" d="M140,207 L200,139"/>
  <path class="edge" d="M370,139 L630,139" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="460.635" y="130" width="78.73" height="18" rx="3"/>
  <text x="500" y="139" text-anchor="middle" class="small">MQTT (JSON)</text>
  <rect class="shape blue" x="630" y="176" width="210" height="46" rx="6"/>
  <text x="735" y="192" text-anchor="middle">MQTT client</text>
  <text x="735" y="206.5" text-anchor="middle" class="small muted">sparkplug: true</text>
  <rect class="shape purple" x="200" y="176" width="170" height="46" rx="6"/>
  <text x="285" y="192" text-anchor="middle">Sparkplug gateway</text>
  <text x="285" y="206.5" text-anchor="middle" class="small muted">Ignition, …</text>
  <path class="edge" d="M140,207 L200,199"/>
  <path class="edge" d="M370,199 L630,199" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="464.43" y="190" width="71.14" height="18" rx="3"/>
  <text x="500" y="199" text-anchor="middle" class="small">Sparkplug B</text>
  <rect class="shape blue dashed" x="630" y="236" width="210" height="46" rx="6"/>
  <text x="735" y="252" text-anchor="middle">OPC UA client</text>
  <text x="735" y="266.5" text-anchor="middle" class="small muted">planned</text>
  <rect class="shape orange" x="200" y="236" width="170" height="46" rx="6"/>
  <text x="285" y="252" text-anchor="middle">OPC UA server</text>
  <text x="285" y="266.5" text-anchor="middle" class="small muted">built in from v36</text>
  <path class="edge" d="M140,207 L200,259"/>
  <path class="edge dashed" d="M370,259 L630,259" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="476.09" y="250" width="47.82" height="18" rx="3"/>
  <text x="500" y="259" text-anchor="middle" class="small">OPC UA</text>
  <rect class="shape blue dashed" x="630" y="296" width="210" height="46" rx="6"/>
  <text x="735" y="312" text-anchor="middle">Logix client</text>
  <text x="735" y="326.5" text-anchor="middle" class="small muted">planned</text>
  <path class="edge dashed" d="M140,207 L200,319 L630,319" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="447.05" y="310" width="105.9" height="18" rx="3"/>
  <text x="500" y="319" text-anchor="middle" class="small">EtherNet/IP tags</text>
  <rect class="shape blue" x="630" y="356" width="210" height="46" rx="6"/>
  <text x="735" y="372" text-anchor="middle">NATS</text>
  <text x="735" y="386.5" text-anchor="middle" class="small muted">the same API as clients</text>
  <rect class="shape purple" x="200" y="356" width="170" height="46" rx="6"/>
  <text x="285" y="372" text-anchor="middle">Your process</text>
  <text x="285" y="386.5" text-anchor="middle" class="small muted">any language</text>
  <path class="edge" d="M140,207 L200,379"/>
  <path class="edge" d="M370,379 L630,379" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="468.83" y="370" width="62.34" height="18" rx="3"/>
  <text x="500" y="379" text-anchor="middle" class="small">NATS API</text>
</svg>
