<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Large file contents are uploaded on the cloud, fetched in chunks by the device's file client, and copied out by the update client for install">
  <!-- Simple IoT diagram style: see docs/ref/documentation.md (Diagrams). -->
  <style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #5f5f5f; --line: #3a3a3a;
    --blue: #dae8fc; --blue-s: #6c8ebf;
    --green: #d5e8d4; --green-s: #82b366;
    --yellow: #fff2cc; --yellow-s: #d6b656;
    --purple: #e1d5e7; --purple-s: #9673a6;
    --orange: #ffe6cc; --orange-s: #d79b00;
    --red: #f8cecc; --red-s: #b85450;
    --gray: #f5f5f5; --gray-s: #9a9a9a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --fg: #f0f0f0; --muted: #a8a8a8; --line: #c8c8c8;
      --blue: #1e2a3d; --green: #1f3320; --yellow: #38321c;
      --purple: #2f2538; --orange: #3d2a14; --red: #3d1f1f;
      --gray: #242424; --gray-s: #5a5a5a;
    }
  }
  svg { font-family: Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: var(--bg); }
  text { fill: var(--fg); font-size: 12px; dominant-baseline: central; }
  .title { font-size: 14px; font-weight: 600; dominant-baseline: auto; }
  .small { font-size: 11px; }
  .muted { fill: var(--muted); }
  .bold { font-weight: 600; }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; }
  .shape { stroke-width: 1.2; }
  .blue { fill: var(--blue); stroke: var(--blue-s); }
  .green { fill: var(--green); stroke: var(--green-s); }
  .yellow { fill: var(--yellow); stroke: var(--yellow-s); }
  .purple { fill: var(--purple); stroke: var(--purple-s); }
  .orange { fill: var(--orange); stroke: var(--orange-s); }
  .red { fill: var(--red); stroke: var(--red-s); }
  .gray { fill: var(--gray); stroke: var(--gray-s); }
  .dashed { stroke-dasharray: 5 4; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; }
  .edge.c-blue { stroke: var(--blue-s); }
  .edge.c-green { stroke: var(--green-s); }
  .edge.c-purple { stroke: var(--purple-s); }
  .edge.c-orange { stroke: var(--orange-s); }
  .edge.c-red { stroke: var(--red-s); }
  .head { fill: var(--line); }
  .head.c-blue { fill: var(--blue-s); }
  .head.c-green { fill: var(--green-s); }
  .head.c-purple { fill: var(--purple-s); }
  .head.c-orange { fill: var(--orange-s); }
  .head.c-red { fill: var(--red-s); }
  .actor { fill: none; stroke: var(--fg); stroke-width: 1.5; }
  .label-bg { fill: var(--bg); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-green" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="900" height="400" rx="8"/>
  <rect class="shape gray" x="20" y="20" width="360" height="240" rx="10"/>
  <text class="title" x="32" y="42">☁️ Cloud</text>
  <rect class="shape blue" x="40" y="60" width="140" height="50" rx="6"/>
  <text x="110" y="78" text-anchor="middle">Upload</text>
  <text x="110" y="92.5" text-anchor="middle" class="small muted">UI or siot command</text>
  <rect class="shape green" x="230" y="60" width="130" height="50" rx="6"/>
  <text x="295" y="78" text-anchor="middle">File node</text>
  <text x="295" y="92.5" text-anchor="middle" class="small muted">hash · object</text>
  <rect class="shape purple" x="40" y="170" width="140" height="50" rx="6"/>
  <text x="110" y="188" text-anchor="middle">files bucket</text>
  <text x="110" y="202.5" text-anchor="middle" class="small muted">Object Store</text>
  <rect class="shape blue" x="230" y="170" width="130" height="50" rx="6"/>
  <text x="295" y="188" text-anchor="middle">Store</text>
  <text x="295" y="202.5" text-anchor="middle" class="small muted">checks tree and NUID</text>
  <path class="edge" d="M110,110 L110,170" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="82.24" y="131" width="55.52" height="18" rx="3"/>
  <text x="110" y="140" text-anchor="middle" class="small">contents</text>
  <path class="edge" d="M180,195 L230,195" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="183.18" y="167" width="43.64" height="18" rx="3"/>
  <text x="205" y="176" text-anchor="middle" class="small">chunks</text>
  <text text-anchor="start" class="small muted"><tspan x="20" y="286">Contents travel down the tree only. A gateway</tspan><tspan x="20" y="300">fetches once and serves its own devices from</tspan><tspan x="20" y="314">its copy.</tspan></text>
  <rect class="shape gray" x="500" y="20" width="380" height="360" rx="10"/>
  <text class="title" x="512" y="42">📟 Device</text>
  <rect class="shape green" x="520" y="60" width="150" height="50" rx="6"/>
  <text x="595" y="78" text-anchor="middle">File node</text>
  <text x="595" y="92.5" text-anchor="middle" class="small muted">under the update node</text>
  <rect class="shape blue" x="520" y="170" width="150" height="50" rx="6"/>
  <text x="595" y="188" text-anchor="middle">File client</text>
  <text x="595" y="202.5" text-anchor="middle" class="small muted">fetch on demand</text>
  <rect class="shape purple" x="720" y="170" width="140" height="50" rx="6"/>
  <text x="790" y="188" text-anchor="middle">files bucket</text>
  <text x="790" y="202.5" text-anchor="middle" class="small muted">SHA-256 checked</text>
  <rect class="shape blue" x="520" y="300" width="150" height="50" rx="6"/>
  <text x="595" y="318" text-anchor="middle">Update client</text>
  <text x="595" y="332.5" text-anchor="middle" class="small muted">source = files</text>
  <rect class="shape blue" x="720" y="300" width="140" height="50" rx="6"/>
  <text x="790" y="318" text-anchor="middle">Installer</text>
  <text x="790" y="332.5" text-anchor="middle" class="small muted">Yoe updater or RAUC</text>
  <path class="edge dashed" d="M360,85 L520,85" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="405.75" y="76" width="68.5" height="18" rx="3"/>
  <text x="440" y="85" text-anchor="middle" class="small">points sync</text>
  <path class="edge" d="M595,110 L595,170" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="560.805" y="131" width="68.39" height="18" rx="3"/>
  <text x="595" y="140" text-anchor="middle" class="small">new object</text>
  <path class="edge" d="M520,182 L360,182" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="396.62" y="140" width="86.76" height="32" rx="3"/>
  <text text-anchor="middle" class="small"><tspan x="440" y="149">request</tspan><tspan x="440" y="163">NUID, last seq</tspan></text>
  <path class="edge" d="M360,208 L520,208" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="405.805" y="218" width="68.39" height="32" rx="3"/>
  <text text-anchor="middle" class="small"><tspan x="440" y="227">chunks +</tspan><tspan x="440" y="241">end marker</tspan></text>
  <path class="edge" d="M670,195 L720,195" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="676.15" y="167" width="37.7" height="18" rx="3"/>
  <text x="695" y="176" text-anchor="middle" class="small">store</text>
  <path class="edge" d="M790,220 L790,262 L595,262 L595,300" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="639.14" y="253" width="101.72" height="18" rx="3"/>
  <text x="690" y="262" text-anchor="middle" class="small">copy to directory</text>
  <path class="edge" d="M670,325 L720,325" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="673.84" y="297" width="42.32" height="18" rx="3"/>
  <text x="695" y="306" text-anchor="middle" class="small">install</text>
</svg>
