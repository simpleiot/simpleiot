<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-label="Nodes and points for an MCU device">
  <!-- Simple IoT diagram style: see docs/ref/documentation.md (Diagrams). -->
  <style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #5f5f5f; --line: #3a3a3a;
    --blue: #dae8fc; --blue-s: #6c8ebf;
    --green: #d5e8d4; --green-s: #82b366;
    --yellow: #fff2cc; --yellow-s: #d6b656;
    --purple: #e1d5e7; --purple-s: #9673a6;
    --orange: #ffe6cc; --orange-s: #d79b00;
    --red: #f8cecc; --red-s: #b85450;
    --gray: #f5f5f5; --gray-s: #9a9a9a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --fg: #f0f0f0; --muted: #a8a8a8; --line: #c8c8c8;
      --blue: #1e2a3d; --green: #1f3320; --yellow: #38321c;
      --purple: #2f2538; --orange: #3d2a14; --red: #3d1f1f;
      --gray: #242424; --gray-s: #5a5a5a;
    }
  }
  svg { font-family: Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: var(--bg); }
  text { fill: var(--fg); font-size: 12px; dominant-baseline: central; }
  .title { font-size: 14px; font-weight: 600; dominant-baseline: auto; }
  .small { font-size: 11px; }
  .muted { fill: var(--muted); }
  .bold { font-weight: 600; }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; }
  .shape { stroke-width: 1.2; }
  .blue { fill: var(--blue); stroke: var(--blue-s); }
  .green { fill: var(--green); stroke: var(--green-s); }
  .yellow { fill: var(--yellow); stroke: var(--yellow-s); }
  .purple { fill: var(--purple); stroke: var(--purple-s); }
  .orange { fill: var(--orange); stroke: var(--orange-s); }
  .red { fill: var(--red); stroke: var(--red-s); }
  .gray { fill: var(--gray); stroke: var(--gray-s); }
  .dashed { stroke-dasharray: 5 4; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; }
  .edge.c-blue { stroke: var(--blue-s); }
  .edge.c-green { stroke: var(--green-s); }
  .edge.c-purple { stroke: var(--purple-s); }
  .edge.c-orange { stroke: var(--orange-s); }
  .edge.c-red { stroke: var(--red-s); }
  .head { fill: var(--line); }
  .head.c-blue { fill: var(--blue-s); }
  .head.c-green { fill: var(--green-s); }
  .head.c-purple { fill: var(--purple-s); }
  .head.c-orange { fill: var(--orange-s); }
  .head.c-red { fill: var(--red-s); }
  .actor { fill: none; stroke: var(--fg); stroke-width: 1.5; }
  .label-bg { fill: var(--bg); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-green" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="860" height="380" rx="8"/>
  <rect class="shape green" x="330" y="20" width="200" height="125" rx="6"/>
  <text x="430" y="35" text-anchor="middle" class="bold">📟 Device</text>
  <rect class="shape yellow" x="336" y="50" width="188" height="89" rx="3"/>
  <text x="344" y="60.5" text-anchor="start" class="small">serial number</text>
  <text x="344" y="77.5" text-anchor="start" class="small">FW version</text>
  <text x="344" y="94.5" text-anchor="start" class="small">HW version</text>
  <text x="344" y="111.5" text-anchor="start" class="small">uptime</text>
  <text x="344" y="128.5" text-anchor="start" class="small">temperature</text>
  <rect class="shape green" x="20" y="200" width="150" height="91" rx="6"/>
  <text x="95" y="215" text-anchor="middle" class="bold">⚙️ Motor 1</text>
  <rect class="shape yellow" x="26" y="230" width="138" height="55" rx="3"/>
  <text x="34" y="240.5" text-anchor="start" class="small">current speed</text>
  <text x="34" y="257.5" text-anchor="start" class="small">commanded speed</text>
  <text x="34" y="274.5" text-anchor="start" class="small">current</text>
  <rect class="shape green" x="190" y="200" width="150" height="91" rx="6"/>
  <text x="265" y="215" text-anchor="middle" class="bold">🔌 Dry contacts</text>
  <rect class="shape yellow" x="196" y="230" width="138" height="55" rx="3"/>
  <text x="204" y="240.5" text-anchor="start" class="small">index 0 on/off</text>
  <text x="204" y="257.5" text-anchor="start" class="small">index 1 on/off</text>
  <text x="204" y="274.5" text-anchor="start" class="small">index 2 on/off</text>
  <rect class="shape green" x="360" y="200" width="140" height="125" rx="6"/>
  <text x="430" y="215" text-anchor="middle" class="bold">📈 A/D</text>
  <rect class="shape yellow" x="366" y="230" width="128" height="89" rx="3"/>
  <text x="374" y="240.5" text-anchor="start" class="small">channel</text>
  <text x="374" y="257.5" text-anchor="start" class="small">sample rate</text>
  <text x="374" y="274.5" text-anchor="start" class="small">scaling</text>
  <text x="374" y="291.5" text-anchor="start" class="small">value</text>
  <text x="374" y="308.5" text-anchor="start" class="small">filter</text>
  <rect class="shape green" x="600" y="200" width="180" height="57" rx="6"/>
  <text x="690" y="215" text-anchor="middle" class="bold">📜 Rule</text>
  <rect class="shape yellow" x="606" y="230" width="168" height="21" rx="3"/>
  <text x="614" y="240.5" text-anchor="start" class="small">description</text>
  <path class="edge" d="M430,145 L430,172.5 L95,172.5 L95,200"/>
  <path class="edge" d="M430,145 L430,172.5 L265,172.5 L265,200"/>
  <path class="edge" d="M430,145 L430,172.5 L430,172.5 L430,200"/>
  <path class="edge" d="M430,145 L430,172.5 L690,172.5 L690,200"/>
  <rect class="shape green" x="520" y="300" width="105" height="57" rx="6"/>
  <text x="572.5" y="315" text-anchor="middle" class="bold">Condition</text>
  <rect class="shape yellow" x="526" y="330" width="93" height="21" rx="3"/>
  <text x="534" y="340.5" text-anchor="start" class="small">DC 1 is on</text>
  <rect class="shape green" x="635" y="300" width="105" height="57" rx="6"/>
  <text x="687.5" y="315" text-anchor="middle" class="bold">Condition</text>
  <rect class="shape yellow" x="641" y="330" width="93" height="21" rx="3"/>
  <text x="649" y="340.5" text-anchor="start" class="small">DC 2 is off</text>
  <rect class="shape green" x="750" y="300" width="100" height="57" rx="6"/>
  <text x="800" y="315" text-anchor="middle" class="bold">Action</text>
  <rect class="shape yellow" x="756" y="330" width="88" height="21" rx="3"/>
  <text x="764" y="340.5" text-anchor="start" class="small">motor 1 on</text>
  <path class="edge" d="M690,257 L690,278.5 L572.5,278.5 L572.5,300"/>
  <path class="edge" d="M690,257 L690,278.5 L687.5,278.5 L687.5,300"/>
  <path class="edge" d="M690,257 L690,278.5 L800,278.5 L800,300"/>
</svg>
