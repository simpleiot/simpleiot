<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="The browser uses HTTP for sign-in and node operations, and NATS over WebSocket for everything else">
  <!-- Simple IoT diagram style: see docs/ref/documentation.md (Diagrams). -->
  <style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #5f5f5f; --line: #3a3a3a;
    --blue: #dae8fc; --blue-s: #6c8ebf;
    --green: #d5e8d4; --green-s: #82b366;
    --yellow: #fff2cc; --yellow-s: #d6b656;
    --purple: #e1d5e7; --purple-s: #9673a6;
    --orange: #ffe6cc; --orange-s: #d79b00;
    --red: #f8cecc; --red-s: #b85450;
    --gray: #f5f5f5; --gray-s: #9a9a9a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --fg: #f0f0f0; --muted: #a8a8a8; --line: #c8c8c8;
      --blue: #1e2a3d; --green: #1f3320; --yellow: #38321c;
      --purple: #2f2538; --orange: #3d2a14; --red: #3d1f1f;
      --gray: #242424; --gray-s: #5a5a5a;
    }
  }
  svg { font-family: Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: var(--bg); }
  text { fill: var(--fg); font-size: 12px; dominant-baseline: central; }
  .title { font-size: 14px; font-weight: 600; dominant-baseline: auto; }
  .small { font-size: 11px; }
  .muted { fill: var(--muted); }
  .bold { font-weight: 600; }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; }
  .shape { stroke-width: 1.2; }
  .blue { fill: var(--blue); stroke: var(--blue-s); }
  .green { fill: var(--green); stroke: var(--green-s); }
  .yellow { fill: var(--yellow); stroke: var(--yellow-s); }
  .purple { fill: var(--purple); stroke: var(--purple-s); }
  .orange { fill: var(--orange); stroke: var(--orange-s); }
  .red { fill: var(--red); stroke: var(--red-s); }
  .gray { fill: var(--gray); stroke: var(--gray-s); }
  .dashed { stroke-dasharray: 5 4; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; }
  .edge.c-blue { stroke: var(--blue-s); }
  .edge.c-green { stroke: var(--green-s); }
  .edge.c-purple { stroke: var(--purple-s); }
  .edge.c-orange { stroke: var(--orange-s); }
  .edge.c-red { stroke: var(--red-s); }
  .head { fill: var(--line); }
  .head.c-blue { fill: var(--blue-s); }
  .head.c-green { fill: var(--green-s); }
  .head.c-purple { fill: var(--purple-s); }
  .head.c-orange { fill: var(--orange-s); }
  .head.c-red { fill: var(--red-s); }
  .actor { fill: none; stroke: var(--fg); stroke-width: 1.5; }
  .label-bg { fill: var(--bg); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-green" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="860" height="400" rx="8"/>
  <rect class="shape gray" x="20" y="20" width="200" height="300" rx="10"/>
  <text class="title" x="32" y="42">🌐 Browser</text>
  <rect class="shape blue" x="40" y="70" width="160" height="196" rx="6"/>
  <text x="120" y="168" text-anchor="middle">Svelte UI</text>
  <rect class="shape gray" x="300" y="20" width="540" height="360" rx="10"/>
  <text class="title" x="312" y="42">📦 SIOT instance</text>
  <rect class="shape gray dashed" x="320" y="60" width="190" height="260" rx="10"/>
  <text class="title" x="332" y="82">HTTP port</text>
  <rect class="shape blue" x="340" y="100" width="150" height="56" rx="6"/>
  <text x="415" y="121" text-anchor="middle">HTTP API</text>
  <text x="415" y="135.5" text-anchor="middle" class="small muted">sign-in, node operations</text>
  <rect class="shape blue" x="340" y="210" width="150" height="56" rx="6"/>
  <text x="415" y="238" text-anchor="middle">WebSocket relay</text>
  <rect class="shape purple" x="560" y="210" width="130" height="56" rx="6"/>
  <text x="625" y="231" text-anchor="middle">NATS server</text>
  <text x="625" y="245.5" text-anchor="middle" class="small muted">loopback listener</text>
  <rect class="shape blue" x="720" y="210" width="100" height="56" rx="6"/>
  <text x="770" y="231" text-anchor="middle">Store</text>
  <text x="770" y="245.5" text-anchor="middle" class="small muted">answers requests</text>
  <rect class="shape blue" x="565" y="100" width="120" height="56" rx="6"/>
  <text x="625" y="121" text-anchor="middle">Authorizer</text>
  <text x="625" y="135.5" text-anchor="middle" class="small muted">scope from the tree</text>
  <path class="edge" d="M200,128 L340,128" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect class="label-bg" x="251.48" y="119" width="37.04" height="18" rx="3"/>
  <text x="270" y="128" text-anchor="middle" class="small">HTTP</text>
  <path class="edge" d="M200,238 L340,238" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect class="label-bg" x="236.905" y="222" width="66.19" height="32" rx="3"/>
  <text text-anchor="middle" class="small"><tspan x="270" y="231">NATS over</tspan><tspan x="270" y="245">WebSocket</tspan></text>
  <path class="edge" d="M490,238 L560,238" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path class="edge" d="M690,238 L720,238" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path class="edge" d="M625,210 L625,156" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="600.21" y="174" width="49.58" height="18" rx="3"/>
  <text x="625" y="183" text-anchor="middle" class="small">connect</text>
  <text x="560" y="296" text-anchor="start" class="mono">u.&lt;anchor&gt;.&lt;user&gt;.nodes…</text>
  <text x="772" y="296" text-anchor="start" class="small muted">read nodes</text>
  <text x="560" y="314" text-anchor="start" class="mono">u.&lt;anchor&gt;.&lt;user&gt;.p…</text>
  <text x="772" y="314" text-anchor="start" class="small muted">write points</text>
  <text x="560" y="332" text-anchor="start" class="mono">up.&lt;anchor&gt;.…</text>
  <text x="772" y="332" text-anchor="start" class="small muted">live updates</text>
  <text x="560" y="350" text-anchor="start" class="mono">auth.me</text>
  <text x="772" y="350" text-anchor="start" class="small muted">who am I</text>
  <text text-anchor="middle" class="small muted"><tspan x="120" y="278">the sign-in JWT is the</tspan><tspan x="120" y="292">NATS password and the</tspan><tspan x="120" y="306">HTTP Authorization header</tspan></text>
</svg>
