<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-label="Three approaches to application redundancy: active/passive against a NATS cluster, active/active, and peer instances replicating through sync">
  <!-- Simple IoT diagram style: see docs/ref/documentation.md (Diagrams). -->
  <style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #5f5f5f; --line: #3a3a3a;
    --blue: #dae8fc; --blue-s: #6c8ebf;
    --green: #d5e8d4; --green-s: #82b366;
    --yellow: #fff2cc; --yellow-s: #d6b656;
    --purple: #e1d5e7; --purple-s: #9673a6;
    --orange: #ffe6cc; --orange-s: #d79b00;
    --red: #f8cecc; --red-s: #b85450;
    --gray: #f5f5f5; --gray-s: #9a9a9a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --fg: #f0f0f0; --muted: #a8a8a8; --line: #c8c8c8;
      --blue: #1e2a3d; --green: #1f3320; --yellow: #38321c;
      --purple: #2f2538; --orange: #3d2a14; --red: #3d1f1f;
      --gray: #242424; --gray-s: #5a5a5a;
    }
  }
  svg { font-family: Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: var(--bg); }
  text { fill: var(--fg); font-size: 12px; dominant-baseline: central; }
  .title { font-size: 14px; font-weight: 600; dominant-baseline: auto; }
  .small { font-size: 11px; }
  .muted { fill: var(--muted); }
  .bold { font-weight: 600; }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; }
  .shape { stroke-width: 1.2; }
  .blue { fill: var(--blue); stroke: var(--blue-s); }
  .green { fill: var(--green); stroke: var(--green-s); }
  .yellow { fill: var(--yellow); stroke: var(--yellow-s); }
  .purple { fill: var(--purple); stroke: var(--purple-s); }
  .orange { fill: var(--orange); stroke: var(--orange-s); }
  .red { fill: var(--red); stroke: var(--red-s); }
  .gray { fill: var(--gray); stroke: var(--gray-s); }
  .dashed { stroke-dasharray: 5 4; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; }
  .edge.c-blue { stroke: var(--blue-s); }
  .edge.c-green { stroke: var(--green-s); }
  .edge.c-purple { stroke: var(--purple-s); }
  .edge.c-orange { stroke: var(--orange-s); }
  .edge.c-red { stroke: var(--red-s); }
  .head { fill: var(--line); }
  .head.c-blue { fill: var(--blue-s); }
  .head.c-green { fill: var(--green-s); }
  .head.c-purple { fill: var(--purple-s); }
  .head.c-orange { fill: var(--orange-s); }
  .head.c-red { fill: var(--red-s); }
  .actor { fill: none; stroke: var(--fg); stroke-width: 1.5; }
  .label-bg { fill: var(--bg); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-green" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="900" height="370" rx="8"/>
  <rect class="shape gray" x="20" y="20" width="280" height="330" rx="10"/>
  <text class="title" x="32" y="42">🔑 Active/passive</text>
  <rect class="shape blue" x="40" y="64" width="115" height="48" rx="6"/>
  <text x="97.5" y="81" text-anchor="middle">SIOT</text>
  <text x="97.5" y="95.5" text-anchor="middle" class="small muted">active, holds lease</text>
  <rect class="shape blue dashed" x="165" y="64" width="115" height="48" rx="6"/>
  <text x="222.5" y="81" text-anchor="middle">SIOT</text>
  <text x="222.5" y="95.5" text-anchor="middle" class="small muted">standby</text>
  <rect class="shape gray" x="40" y="160" width="240" height="110" rx="10"/>
  <text class="title" x="52" y="182">NATS cluster</text>
  <rect class="shape purple" x="56" y="206" width="62" height="40" rx="6"/>
  <text x="87" y="226" text-anchor="middle">NATS</text>
  <rect class="shape purple" x="130" y="206" width="62" height="40" rx="6"/>
  <text x="161" y="226" text-anchor="middle">NATS</text>
  <rect class="shape purple" x="204" y="206" width="62" height="40" rx="6"/>
  <text x="235" y="226" text-anchor="middle">NATS</text>
  <path class="edge" d="M97.5,112 L97.5,160" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="75.185" y="127" width="44.63" height="18" rx="3"/>
  <text x="97.5" y="136" text-anchor="middle" class="small">writes</text>
  <path class="edge dashed" d="M222.5,112 L222.5,160"/>
  <text text-anchor="middle" class="small muted"><tspan x="160" y="299">streams with 3 replicas; the lease</tspan><tspan x="160" y="313">is a KV compare-and-set</tspan></text>
  <rect class="shape gray" x="310" y="20" width="280" height="330" rx="10"/>
  <text class="title" x="322" y="42">⚠️ Active/active</text>
  <rect class="shape blue" x="330" y="64" width="115" height="48" rx="6"/>
  <text x="387.5" y="88" text-anchor="middle">SIOT</text>
  <rect class="shape blue" x="455" y="64" width="115" height="48" rx="6"/>
  <text x="512.5" y="88" text-anchor="middle">SIOT</text>
  <rect class="shape purple" x="380" y="166" width="140" height="48" rx="6"/>
  <text x="450" y="183" text-anchor="middle">NATS + store</text>
  <text x="450" y="197.5" text-anchor="middle" class="small muted">one root ID</text>
  <path class="edge" d="M387.5,112 L410,166" marker-end="url(#arrow)"/>
  <path class="edge" d="M512.5,112 L490,166" marker-end="url(#arrow)"/>
  <rect class="shape red" x="330" y="250" width="240" height="76" rx="6"/>
  <text x="450" y="274" text-anchor="middle">✕ does not work today</text>
  <text text-anchor="middle" class="small muted"><tspan x="450" y="288.5">two origins for one stream,</tspan><tspan x="450" y="302.5">two replies, clients run twice</tspan></text>
  <rect class="shape gray" x="600" y="20" width="280" height="330" rx="10"/>
  <text class="title" x="612" y="42">🔄 Peers through sync</text>
  <rect class="shape blue" x="616" y="64" width="100" height="48" rx="6"/>
  <text x="666" y="81" text-anchor="middle">SIOT A</text>
  <text x="666" y="95.5" text-anchor="middle" class="small muted">own root</text>
  <rect class="shape blue" x="764" y="64" width="100" height="48" rx="6"/>
  <text x="814" y="81" text-anchor="middle">SIOT B</text>
  <text x="814" y="95.5" text-anchor="middle" class="small muted">own root</text>
  <rect class="shape purple" x="621" y="166" width="90" height="44" rx="6"/>
  <text x="666" y="188" text-anchor="middle">streams A</text>
  <rect class="shape purple" x="769" y="166" width="90" height="44" rx="6"/>
  <text x="814" y="188" text-anchor="middle">streams B</text>
  <path class="edge" d="M666,112 L666,166" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="643.685" y="130" width="44.63" height="18" rx="3"/>
  <text x="666" y="139" text-anchor="middle" class="small">writes</text>
  <path class="edge" d="M814,112 L814,166" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="791.685" y="130" width="44.63" height="18" rx="3"/>
  <text x="814" y="139" text-anchor="middle" class="small">writes</text>
  <path class="edge" d="M711,188 L769,188" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect class="label-bg" x="724.12" y="179" width="31.76" height="18" rx="3"/>
  <text x="740" y="188" text-anchor="middle" class="small">sync</text>
  <text text-anchor="middle" class="small muted"><tspan x="740" y="289">root boundary only today;</tspan><tspan x="740" y="303">clients repoint on failover</tspan></text>
</svg>
