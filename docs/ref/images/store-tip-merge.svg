<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="Two streams hold messages for the same subject; the newest tip wins and becomes the current point">
  <!-- Simple IoT diagram style: see docs/ref/documentation.md (Diagrams). -->
  <style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #5f5f5f; --line: #3a3a3a;
    --blue: #dae8fc; --blue-s: #6c8ebf;
    --green: #d5e8d4; --green-s: #82b366;
    --yellow: #fff2cc; --yellow-s: #d6b656;
    --purple: #e1d5e7; --purple-s: #9673a6;
    --orange: #ffe6cc; --orange-s: #d79b00;
    --red: #f8cecc; --red-s: #b85450;
    --gray: #f5f5f5; --gray-s: #9a9a9a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --fg: #f0f0f0; --muted: #a8a8a8; --line: #c8c8c8;
      --blue: #1e2a3d; --green: #1f3320; --yellow: #38321c;
      --purple: #2f2538; --orange: #3d2a14; --red: #3d1f1f;
      --gray: #242424; --gray-s: #5a5a5a;
    }
  }
  svg { font-family: Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: var(--bg); }
  text { fill: var(--fg); font-size: 12px; dominant-baseline: central; }
  .title { font-size: 14px; font-weight: 600; dominant-baseline: auto; }
  .small { font-size: 11px; }
  .muted { fill: var(--muted); }
  .bold { font-weight: 600; }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; }
  .shape { stroke-width: 1.2; }
  .blue { fill: var(--blue); stroke: var(--blue-s); }
  .green { fill: var(--green); stroke: var(--green-s); }
  .yellow { fill: var(--yellow); stroke: var(--yellow-s); }
  .purple { fill: var(--purple); stroke: var(--purple-s); }
  .orange { fill: var(--orange); stroke: var(--orange-s); }
  .red { fill: var(--red); stroke: var(--red-s); }
  .gray { fill: var(--gray); stroke: var(--gray-s); }
  .dashed { stroke-dasharray: 5 4; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; }
  .edge.c-blue { stroke: var(--blue-s); }
  .edge.c-green { stroke: var(--green-s); }
  .edge.c-purple { stroke: var(--purple-s); }
  .edge.c-orange { stroke: var(--orange-s); }
  .edge.c-red { stroke: var(--red-s); }
  .head { fill: var(--line); }
  .head.c-blue { fill: var(--blue-s); }
  .head.c-green { fill: var(--green-s); }
  .head.c-purple { fill: var(--purple-s); }
  .head.c-orange { fill: var(--orange-s); }
  .head.c-red { fill: var(--red-s); }
  .actor { fill: none; stroke: var(--fg); stroke-width: 1.5; }
  .label-bg { fill: var(--bg); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-green" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="860" height="330" rx="8"/>
  <text x="20" y="24" text-anchor="start" class="mono muted">subject  inst.X.&lt;origin&gt;.N1.p.setpoint.0</text>
  <rect class="shape purple" x="20" y="50" width="170" height="52" rx="6"/>
  <text x="105" y="69" text-anchor="middle" class="mono">inst_X_X</text>
  <text x="105" y="83.5" text-anchor="middle" class="small muted">written by device X</text>
  <rect class="shape yellow" x="220" y="56" width="96" height="40" rx="6"/>
  <text x="268" y="69" text-anchor="middle">20.0</text>
  <text x="268" y="83.5" text-anchor="middle" class="small muted">09:50</text>
  <rect class="shape yellow" x="330" y="56" width="96" height="40" rx="6"/>
  <text x="378" y="69" text-anchor="middle">20.5</text>
  <text x="378" y="83.5" text-anchor="middle" class="small muted">10:00</text>
  <path class="edge" d="M316,76 L330,76"/>
  <rect class="shape yellow" x="440" y="56" width="96" height="40" rx="6"/>
  <text x="488" y="69" text-anchor="middle">21.0</text>
  <text x="488" y="83.5" text-anchor="middle" class="small muted">10:05</text>
  <path class="edge" d="M426,76 L440,76"/>
  <text x="488" y="46" text-anchor="middle" class="small bold">tip</text>
  <rect class="shape purple" x="20" y="150" width="170" height="52" rx="6"/>
  <text x="105" y="169" text-anchor="middle" class="mono">inst_X_R</text>
  <text x="105" y="183.5" text-anchor="middle" class="small muted">written by hub R</text>
  <rect class="shape yellow" x="220" y="156" width="96" height="40" rx="6"/>
  <text x="268" y="169" text-anchor="middle">25.0</text>
  <text x="268" y="183.5" text-anchor="middle" class="small muted">09:40</text>
  <rect class="shape yellow" x="330" y="156" width="96" height="40" rx="6"/>
  <text x="378" y="169" text-anchor="middle">23.0</text>
  <text x="378" y="183.5" text-anchor="middle" class="small muted">10:03</text>
  <path class="edge" d="M316,176 L330,176"/>
  <text x="378" y="146" text-anchor="middle" class="small bold">tip</text>
  <rect class="shape blue" x="620" y="92" width="200" height="56" rx="6"/>
  <text x="720" y="113" text-anchor="middle">Merge tips</text>
  <text x="720" y="127.5" text-anchor="middle" class="small muted">in the store's caches</text>
  <path class="edge" d="M536,76 L620,108" marker-end="url(#arrow)"/>
  <path class="edge" d="M426,176 L620,134" marker-end="url(#arrow)"/>
  <rect class="shape yellow" x="640" y="200" width="160" height="52" rx="6"/>
  <text x="720" y="219" text-anchor="middle">setpoint = 21.0</text>
  <text x="720" y="233.5" text-anchor="middle" class="small muted">10:05, device X</text>
  <path class="edge" d="M720,148 L720,200" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="695.21" y="166" width="49.58" height="18" rx="3"/>
  <text x="720" y="175" text-anchor="middle" class="small">current</text>
  <text text-anchor="start" class="small muted"><tspan x="20" y="254">1. The newest point timestamp wins.</tspan><tspan x="20" y="270">2. Equal timestamps: the greater origin ID wins, so every instance agrees.</tspan><tspan x="20" y="286">3. The same timestamp and origin again changes nothing.</tspan></text>
</svg>
