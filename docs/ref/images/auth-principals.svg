<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-label="Each connection is checked by the authorizer and granted a scope based on what it presents">
  <!-- Simple IoT diagram style: see docs/ref/documentation.md (Diagrams). -->
  <style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #5f5f5f; --line: #3a3a3a;
    --blue: #dae8fc; --blue-s: #6c8ebf;
    --green: #d5e8d4; --green-s: #82b366;
    --yellow: #fff2cc; --yellow-s: #d6b656;
    --purple: #e1d5e7; --purple-s: #9673a6;
    --orange: #ffe6cc; --orange-s: #d79b00;
    --red: #f8cecc; --red-s: #b85450;
    --gray: #f5f5f5; --gray-s: #9a9a9a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --fg: #f0f0f0; --muted: #a8a8a8; --line: #c8c8c8;
      --blue: #1e2a3d; --green: #1f3320; --yellow: #38321c;
      --purple: #2f2538; --orange: #3d2a14; --red: #3d1f1f;
      --gray: #242424; --gray-s: #5a5a5a;
    }
  }
  svg { font-family: Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: var(--bg); }
  text { fill: var(--fg); font-size: 12px; dominant-baseline: central; }
  .title { font-size: 14px; font-weight: 600; dominant-baseline: auto; }
  .small { font-size: 11px; }
  .muted { fill: var(--muted); }
  .bold { font-weight: 600; }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; }
  .shape { stroke-width: 1.2; }
  .blue { fill: var(--blue); stroke: var(--blue-s); }
  .green { fill: var(--green); stroke: var(--green-s); }
  .yellow { fill: var(--yellow); stroke: var(--yellow-s); }
  .purple { fill: var(--purple); stroke: var(--purple-s); }
  .orange { fill: var(--orange); stroke: var(--orange-s); }
  .red { fill: var(--red); stroke: var(--red-s); }
  .gray { fill: var(--gray); stroke: var(--gray-s); }
  .dashed { stroke-dasharray: 5 4; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; }
  .edge.c-blue { stroke: var(--blue-s); }
  .edge.c-green { stroke: var(--green-s); }
  .edge.c-purple { stroke: var(--purple-s); }
  .edge.c-orange { stroke: var(--orange-s); }
  .edge.c-red { stroke: var(--red-s); }
  .head { fill: var(--line); }
  .head.c-blue { fill: var(--blue-s); }
  .head.c-green { fill: var(--green-s); }
  .head.c-purple { fill: var(--purple-s); }
  .head.c-orange { fill: var(--orange-s); }
  .head.c-red { fill: var(--red-s); }
  .actor { fill: none; stroke: var(--fg); stroke-width: 1.5; }
  .label-bg { fill: var(--bg); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-green" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="860" height="420" rx="8"/>
  <rect class="shape gray" x="310" y="20" width="220" height="370" rx="10"/>
  <text class="title" x="322" y="42">📦 SIOT instance</text>
  <rect class="shape blue" x="340" y="60" width="160" height="310" rx="6"/>
  <text x="420" y="194" text-anchor="middle">Authorizer</text>
  <text text-anchor="middle" class="small muted"><tspan x="420" y="208.5">checks every</tspan><tspan x="420" y="222.5">NATS, WebSocket,</tspan><tspan x="420" y="236.5">and MQTT connection</tspan></text>
  <rect class="shape blue" x="20" y="40" width="220" height="50" rx="6"/>
  <text x="130" y="58" text-anchor="middle">🛠️ siot command line</text>
  <text x="130" y="72.5" text-anchor="middle" class="small muted">shared token</text>
  <path class="edge" d="M240,65 L340,65" marker-end="url(#arrow)"/>
  <rect class="shape blue" x="20" y="104" width="220" height="50" rx="6"/>
  <text x="130" y="122" text-anchor="middle">⚙️ Server's own clients</text>
  <text x="130" y="136.5" text-anchor="middle" class="small muted">shared token</text>
  <path class="edge" d="M240,129 L340,129" marker-end="url(#arrow)"/>
  <rect class="shape blue" x="20" y="178" width="220" height="50" rx="6"/>
  <text x="130" y="196" text-anchor="middle">👤 Browser</text>
  <text x="130" y="210.5" text-anchor="middle" class="small muted">user ID + sign-in JWT</text>
  <path class="edge" d="M240,203 L340,203" marker-end="url(#arrow)"/>
  <rect class="shape blue" x="20" y="252" width="220" height="50" rx="6"/>
  <text x="130" y="270" text-anchor="middle">📟 Device</text>
  <text x="130" y="284.5" text-anchor="middle" class="small muted">device key (NKey)</text>
  <path class="edge" d="M240,277 L340,277" marker-end="url(#arrow)"/>
  <rect class="shape blue" x="20" y="326" width="220" height="50" rx="6"/>
  <text x="130" y="344" text-anchor="middle">📟 Device with no key yet</text>
  <text x="130" y="358.5" text-anchor="middle" class="small muted">enrollment token + key</text>
  <path class="edge" d="M240,351 L340,351" marker-end="url(#arrow)"/>
  <rect class="shape yellow" x="600" y="40" width="240" height="114" rx="6"/>
  <text x="720" y="83" text-anchor="middle">everything on the instance</text>
  <text text-anchor="middle" class="small muted"><tspan x="720" y="97.5">remote use can be limited with</tspan><tspan x="720" y="111.5">SIOT_DEVICE_AUTH=required</tspan></text>
  <path class="edge" d="M500,97 L600,97" marker-end="url(#arrow)"/>
  <rect class="shape yellow" x="600" y="178" width="240" height="50" rx="6"/>
  <text x="720" y="196" text-anchor="middle">the user's groups</text>
  <text x="720" y="210.5" text-anchor="middle" class="small muted">u.* requests, auth.me, up.*</text>
  <path class="edge" d="M500,203 L600,203" marker-end="url(#arrow)"/>
  <rect class="shape yellow" x="600" y="252" width="240" height="50" rx="6"/>
  <text x="720" y="270" text-anchor="middle">its own device subtree</text>
  <text x="720" y="284.5" text-anchor="middle" class="small muted">the subjects sync needs</text>
  <path class="edge" d="M500,277 L600,277" marker-end="url(#arrow)"/>
  <rect class="shape yellow" x="600" y="326" width="240" height="50" rx="6"/>
  <text x="720" y="344" text-anchor="middle">one request</text>
  <text x="720" y="358.5" text-anchor="middle" class="small muted">enroll.request</text>
  <path class="edge" d="M500,351 L600,351" marker-end="url(#arrow)"/>
</svg>
