<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-label="Each device instance holds a subtree of the cloud node tree, kept in sync both ways">
  <!-- Simple IoT diagram style: see docs/ref/documentation.md (Diagrams). -->
  <style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #5f5f5f; --line: #3a3a3a;
    --blue: #dae8fc; --blue-s: #6c8ebf;
    --green: #d5e8d4; --green-s: #82b366;
    --yellow: #fff2cc; --yellow-s: #d6b656;
    --purple: #e1d5e7; --purple-s: #9673a6;
    --orange: #ffe6cc; --orange-s: #d79b00;
    --red: #f8cecc; --red-s: #b85450;
    --gray: #f5f5f5; --gray-s: #9a9a9a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --fg: #f0f0f0; --muted: #a8a8a8; --line: #c8c8c8;
      --blue: #1e2a3d; --green: #1f3320; --yellow: #38321c;
      --purple: #2f2538; --orange: #3d2a14; --red: #3d1f1f;
      --gray: #242424; --gray-s: #5a5a5a;
    }
  }
  svg { font-family: Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: var(--bg); }
  text { fill: var(--fg); font-size: 12px; dominant-baseline: central; }
  .title { font-size: 14px; font-weight: 600; dominant-baseline: auto; }
  .small { font-size: 11px; }
  .muted { fill: var(--muted); }
  .bold { font-weight: 600; }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; }
  .shape { stroke-width: 1.2; }
  .blue { fill: var(--blue); stroke: var(--blue-s); }
  .green { fill: var(--green); stroke: var(--green-s); }
  .yellow { fill: var(--yellow); stroke: var(--yellow-s); }
  .purple { fill: var(--purple); stroke: var(--purple-s); }
  .orange { fill: var(--orange); stroke: var(--orange-s); }
  .red { fill: var(--red); stroke: var(--red-s); }
  .gray { fill: var(--gray); stroke: var(--gray-s); }
  .dashed { stroke-dasharray: 5 4; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; }
  .edge.c-blue { stroke: var(--blue-s); }
  .edge.c-green { stroke: var(--green-s); }
  .edge.c-purple { stroke: var(--purple-s); }
  .edge.c-orange { stroke: var(--orange-s); }
  .edge.c-red { stroke: var(--red-s); }
  .head { fill: var(--line); }
  .head.c-blue { fill: var(--blue-s); }
  .head.c-green { fill: var(--green-s); }
  .head.c-purple { fill: var(--purple-s); }
  .head.c-orange { fill: var(--orange-s); }
  .head.c-red { fill: var(--red-s); }
  .actor { fill: none; stroke: var(--fg); stroke-width: 1.5; }
  .label-bg { fill: var(--bg); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-green" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="860" height="380" rx="8"/>
  <rect class="shape gray" x="20" y="20" width="440" height="340" rx="10"/>
  <text class="title" x="32" y="42">☁️ SIOT cloud instance</text>
  <rect class="shape green" x="40" y="172" width="80" height="36" rx="6"/>
  <text x="80" y="190" text-anchor="middle">root</text>
  <rect class="shape green dashed" x="150" y="52" width="290" height="128" rx="10"/>
  <rect class="shape green dashed" x="150" y="204" width="290" height="128" rx="10"/>
  <rect class="shape green" x="166" y="98" width="100" height="36" rx="6"/>
  <text x="216" y="116" text-anchor="middle">Device 1</text>
  <path class="edge" d="M120,190 L136,190 L136,116 L166,116"/>
  <rect class="shape green" x="310" y="68" width="110" height="36" rx="6"/>
  <text x="365" y="86" text-anchor="middle">Sensor A</text>
  <path class="edge" d="M266,116 L282,116 L282,86 L310,86"/>
  <rect class="shape green" x="310" y="124" width="110" height="36" rx="6"/>
  <text x="365" y="142" text-anchor="middle">Sensor B</text>
  <path class="edge" d="M266,116 L282,116 L282,142 L310,142"/>
  <rect class="shape green" x="166" y="250" width="100" height="36" rx="6"/>
  <text x="216" y="268" text-anchor="middle">Device 2</text>
  <path class="edge" d="M120,190 L136,190 L136,268 L166,268"/>
  <rect class="shape green" x="310" y="220" width="110" height="36" rx="6"/>
  <text x="365" y="238" text-anchor="middle">Pump</text>
  <path class="edge" d="M266,268 L282,268 L282,238 L310,238"/>
  <rect class="shape green" x="310" y="276" width="110" height="36" rx="6"/>
  <text x="365" y="294" text-anchor="middle">Tank</text>
  <path class="edge" d="M266,268 L282,268 L282,294 L310,294"/>
  <rect class="shape gray" x="540" y="20" width="300" height="150" rx="10"/>
  <text class="title" x="552" y="42">📟 Device 1 instance</text>
  <rect class="shape green" x="560" y="95" width="100" height="36" rx="6"/>
  <text x="610" y="113" text-anchor="middle">Device 1</text>
  <rect class="shape green" x="710" y="66" width="110" height="36" rx="6"/>
  <text x="765" y="84" text-anchor="middle">Sensor A</text>
  <path class="edge" d="M660,113 L676,113 L676,84 L710,84"/>
  <rect class="shape green" x="710" y="120" width="110" height="36" rx="6"/>
  <text x="765" y="138" text-anchor="middle">Sensor B</text>
  <path class="edge" d="M660,113 L676,113 L676,138 L710,138"/>
  <path class="edge dashed" d="M440,116 L540,95" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect class="label-bg" x="474.12" y="96.5" width="31.76" height="18" rx="3"/>
  <text x="490" y="105.5" text-anchor="middle" class="small">sync</text>
  <rect class="shape gray" x="540" y="210" width="300" height="150" rx="10"/>
  <text class="title" x="552" y="232">📟 Device 2 instance</text>
  <rect class="shape green" x="560" y="285" width="100" height="36" rx="6"/>
  <text x="610" y="303" text-anchor="middle">Device 2</text>
  <rect class="shape green" x="710" y="256" width="110" height="36" rx="6"/>
  <text x="765" y="274" text-anchor="middle">Pump</text>
  <path class="edge" d="M660,303 L676,303 L676,274 L710,274"/>
  <rect class="shape green" x="710" y="310" width="110" height="36" rx="6"/>
  <text x="765" y="328" text-anchor="middle">Tank</text>
  <path class="edge" d="M660,303 L676,303 L676,328 L710,328"/>
  <path class="edge dashed" d="M440,268 L540,285" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect class="label-bg" x="474.12" y="267.5" width="31.76" height="18" rx="3"/>
  <text x="490" y="276.5" text-anchor="middle" class="small">sync</text>
</svg>
