<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 790" width="860" height="790" role="img" aria-label="Life of a sync connection between device X and hub R, and catching up after a disconnect with current values sent ahead of the backlog">
  <!-- Simple IoT diagram style: see docs/ref/documentation.md (Diagrams). -->
  <style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #5f5f5f; --line: #3a3a3a;
    --blue: #dae8fc; --blue-s: #6c8ebf;
    --green: #d5e8d4; --green-s: #82b366;
    --yellow: #fff2cc; --yellow-s: #d6b656;
    --purple: #e1d5e7; --purple-s: #9673a6;
    --orange: #ffe6cc; --orange-s: #d79b00;
    --red: #f8cecc; --red-s: #b85450;
    --gray: #f5f5f5; --gray-s: #9a9a9a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --fg: #f0f0f0; --muted: #a8a8a8; --line: #c8c8c8;
      --blue: #1e2a3d; --green: #1f3320; --yellow: #38321c;
      --purple: #2f2538; --orange: #3d2a14; --red: #3d1f1f;
      --gray: #242424; --gray-s: #5a5a5a;
    }
  }
  svg { font-family: Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: var(--bg); }
  text { fill: var(--fg); font-size: 12px; dominant-baseline: central; }
  .title { font-size: 14px; font-weight: 600; dominant-baseline: auto; }
  .small { font-size: 11px; }
  .muted { fill: var(--muted); }
  .bold { font-weight: 600; }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; }
  .shape { stroke-width: 1.2; }
  .blue { fill: var(--blue); stroke: var(--blue-s); }
  .green { fill: var(--green); stroke: var(--green-s); }
  .yellow { fill: var(--yellow); stroke: var(--yellow-s); }
  .purple { fill: var(--purple); stroke: var(--purple-s); }
  .orange { fill: var(--orange); stroke: var(--orange-s); }
  .red { fill: var(--red); stroke: var(--red-s); }
  .gray { fill: var(--gray); stroke: var(--gray-s); }
  .dashed { stroke-dasharray: 5 4; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; }
  .edge.c-blue { stroke: var(--blue-s); }
  .edge.c-green { stroke: var(--green-s); }
  .edge.c-purple { stroke: var(--purple-s); }
  .edge.c-orange { stroke: var(--orange-s); }
  .edge.c-red { stroke: var(--red-s); }
  .head { fill: var(--line); }
  .head.c-blue { fill: var(--blue-s); }
  .head.c-green { fill: var(--green-s); }
  .head.c-purple { fill: var(--purple-s); }
  .head.c-orange { fill: var(--orange-s); }
  .head.c-red { fill: var(--red-s); }
  .actor { fill: none; stroke: var(--fg); stroke-width: 1.5; }
  .label-bg { fill: var(--bg); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-green" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="860" height="790" rx="8"/>
  <rect class="shape gray" x="20" y="20" width="470" height="750" rx="10"/>
  <text class="title" x="32" y="42">📟 Device X</text>
  <rect class="shape gray" x="560" y="20" width="280" height="750" rx="10"/>
  <text class="title" x="572" y="42">☁️ Hub R</text>
  <rect class="shape blue" x="50" y="56" width="160" height="40" rx="6"/>
  <text x="130" y="76" text-anchor="middle">Store</text>
  <rect class="shape blue" x="290" y="56" width="160" height="40" rx="6"/>
  <text x="370" y="76" text-anchor="middle">Sync client</text>
  <rect class="shape blue" x="600" y="56" width="200" height="40" rx="6"/>
  <text x="700" y="76" text-anchor="middle">NATS server + store</text>
  <path class="edge dashed" d="M130,96 V750" style="stroke-width:1"/>
  <path class="edge dashed" d="M370,96 V750" style="stroke-width:1"/>
  <path class="edge dashed" d="M700,96 V750" style="stroke-width:1"/>
  <path class="edge" d="M370,140 L700,140" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="445.365" y="121" width="179.27" height="18" rx="3"/>
  <text x="535" y="130" text-anchor="middle" class="small">1  connect (NATS or WebSocket)</text>
  <path class="edge" d="M370,196 L700,196" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="446.245" y="163" width="177.51" height="32" rx="3"/>
  <text text-anchor="middle" class="small"><tspan x="535" y="172">2  announce root X with an edge</tspan><tspan x="535" y="186">(only if the hub has no node X)</tspan></text>
  <rect class="shape blue" x="590" y="214" width="220" height="42" rx="6"/>
  <text text-anchor="middle" class="small"><tspan x="700" y="227.5">adopt: create device node X</tspan><tspan x="700" y="242.5">and stream inst_X_R</tspan></text>
  <path class="edge" d="M370,296 L700,296" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="456.255" y="263" width="157.49" height="32" rx="3"/>
  <text text-anchor="middle" class="small"><tspan x="535" y="272">3  push pump: copy inst_X_X</tspan><tspan x="535" y="286">into its replica on the hub</tspan></text>
  <text x="535" y="312" text-anchor="middle" class="small muted">first connect: from sequence 1</text>
  <path class="edge" d="M700,372 L370,372" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="443.33" y="353" width="183.34" height="18" rx="3"/>
  <text x="535" y="362" text-anchor="middle" class="small">4  pull pump: copy inst_X_R down</text>
  <path class="edge" d="M370,372 L130,372" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="204.53" y="353" width="90.94" height="18" rx="3"/>
  <text x="250" y="362" text-anchor="middle" class="small">into the replica</text>
  <rect class="shape blue" x="45" y="410" width="170" height="42" rx="6"/>
  <text text-anchor="middle" class="small"><tspan x="130" y="423.5">5  merge tips,</tspan><tspan x="130" y="438.5">re-broadcast changes</tspan></text>
  <rect class="shape blue" x="600" y="410" width="200" height="42" rx="6"/>
  <text text-anchor="middle" class="small"><tspan x="700" y="423.5">5  merge tips,</tspan><tspan x="700" y="438.5">re-broadcast changes</tspan></text>
  <path class="edge dashed" d="M36,490 L824,490"/>
  <rect class="label-bg" x="288.83" y="481" width="282.34" height="18" rx="3"/>
  <text x="430" y="490" text-anchor="middle" class="small">link down: each side keeps writing its own streams</text>
  <path class="edge" d="M370,548 L700,548" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="423.2" y="529" width="223.6" height="18" rx="3"/>
  <text x="535" y="538" text-anchor="middle" class="small">6  reconnect: durable consumers resume</text>
  <path class="edge c-purple" d="M370,600 L700,600" marker-end="url(#arrow-purple)" marker-start="url(#arrow-purple)"/>
  <rect class="label-bg" x="410.11" y="567" width="249.78" height="32" rx="3"/>
  <text text-anchor="middle" class="small"><tspan x="535" y="576">7  current values first, then new points</tspan><tspan x="535" y="590">(snap. subjects, until the history catches up)</tspan></text>
  <path class="edge" d="M370,652 L700,652" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect class="label-bg" x="441.57" y="633" width="186.86" height="18" rx="3"/>
  <text x="535" y="642" text-anchor="middle" class="small">8  alongside: the backlog, in order</text>
  <rect class="shape blue" x="25" y="680" width="210" height="42" rx="6"/>
  <text text-anchor="middle" class="small"><tspan x="130" y="693.5">clients get current values first;</tspan><tspan x="130" y="708.5">history gets every point</tspan></text>
  <rect class="shape blue" x="585" y="680" width="230" height="42" rx="6"/>
  <text text-anchor="middle" class="small"><tspan x="700" y="693.5">clients get current values first;</tspan><tspan x="700" y="708.5">history gets every point</tspan></text>
</svg>
