<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="A rule or the web UI raises a notification point; user nodes turn it into message points; each messaging service deduplicates, rate limits, and delivers">
  <!-- Simple IoT diagram style: see docs/ref/documentation.md (Diagrams). -->
  <style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #5f5f5f; --line: #3a3a3a;
    --blue: #dae8fc; --blue-s: #6c8ebf;
    --green: #d5e8d4; --green-s: #82b366;
    --yellow: #fff2cc; --yellow-s: #d6b656;
    --purple: #e1d5e7; --purple-s: #9673a6;
    --orange: #ffe6cc; --orange-s: #d79b00;
    --red: #f8cecc; --red-s: #b85450;
    --gray: #f5f5f5; --gray-s: #9a9a9a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --fg: #f0f0f0; --muted: #a8a8a8; --line: #c8c8c8;
      --blue: #1e2a3d; --green: #1f3320; --yellow: #38321c;
      --purple: #2f2538; --orange: #3d2a14; --red: #3d1f1f;
      --gray: #242424; --gray-s: #5a5a5a;
    }
  }
  svg { font-family: Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: var(--bg); }
  text { fill: var(--fg); font-size: 12px; dominant-baseline: central; }
  .title { font-size: 14px; font-weight: 600; dominant-baseline: auto; }
  .small { font-size: 11px; }
  .muted { fill: var(--muted); }
  .bold { font-weight: 600; }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; }
  .shape { stroke-width: 1.2; }
  .blue { fill: var(--blue); stroke: var(--blue-s); }
  .green { fill: var(--green); stroke: var(--green-s); }
  .yellow { fill: var(--yellow); stroke: var(--yellow-s); }
  .purple { fill: var(--purple); stroke: var(--purple-s); }
  .orange { fill: var(--orange); stroke: var(--orange-s); }
  .red { fill: var(--red); stroke: var(--red-s); }
  .gray { fill: var(--gray); stroke: var(--gray-s); }
  .dashed { stroke-dasharray: 5 4; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; }
  .edge.c-blue { stroke: var(--blue-s); }
  .edge.c-green { stroke: var(--green-s); }
  .edge.c-purple { stroke: var(--purple-s); }
  .edge.c-orange { stroke: var(--orange-s); }
  .edge.c-red { stroke: var(--red-s); }
  .head { fill: var(--line); }
  .head.c-blue { fill: var(--blue-s); }
  .head.c-green { fill: var(--green-s); }
  .head.c-purple { fill: var(--purple-s); }
  .head.c-orange { fill: var(--orange-s); }
  .head.c-red { fill: var(--red-s); }
  .actor { fill: none; stroke: var(--fg); stroke-width: 1.5; }
  .label-bg { fill: var(--bg); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-green" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="900" height="400" rx="8"/>
  <rect class="shape green" x="20" y="70" width="160" height="48" rx="6"/>
  <text x="100" y="87" text-anchor="middle">📜 Rule node</text>
  <text x="100" y="101.5" text-anchor="middle" class="small muted">notify action fires</text>
  <rect class="shape green" x="20" y="170" width="160" height="48" rx="6"/>
  <text x="100" y="187" text-anchor="middle">Any node</text>
  <text x="100" y="201.5" text-anchor="middle" class="small muted">message from the web UI</text>
  <rect class="shape yellow" x="240" y="116" width="150" height="56" rx="6"/>
  <text x="315" y="137" text-anchor="middle" class="mono">notification</text>
  <text x="315" y="151.5" text-anchor="middle" class="small muted">what happened</text>
  <path class="edge" d="M180,94 L240,130" marker-end="url(#arrow)"/>
  <path class="edge" d="M180,194 L240,158" marker-end="url(#arrow)"/>
  <rect class="shape green" x="440" y="30" width="180" height="62" rx="6"/>
  <text x="530" y="47" text-anchor="middle">👤 User node</text>
  <text text-anchor="middle" class="small muted"><tspan x="530" y="61.5">watches up.&lt;parent&gt;.&gt;</tspan><tspan x="530" y="75.5">adds phone and email</tspan></text>
  <rect class="shape yellow" x="440" y="150" width="180" height="56" rx="6"/>
  <text x="530" y="171" text-anchor="middle" class="mono">message</text>
  <text x="530" y="185.5" text-anchor="middle" class="small muted">who to send it to</text>
  <path class="edge" d="M390,130 L415,130 L415,61 L440,61" marker-end="url(#arrow)"/>
  <path class="edge" d="M530,92 L530,150" marker-end="url(#arrow)"/>
  <rect class="label-bg" x="510.655" y="112" width="38.69" height="18" rx="3"/>
  <text x="530" y="121" text-anchor="middle" class="small">emits</text>
  <rect class="shape gray" x="670" y="20" width="210" height="300" rx="10"/>
  <text class="title" x="682" y="42">📨 Messaging service</text>
  <rect class="shape blue" x="686" y="56" width="178" height="70" rx="6"/>
  <text x="775" y="77" text-anchor="middle">Reads points</text>
  <text text-anchor="middle" class="small muted"><tspan x="775" y="91.5">Twilio, SMTP: message</tspan><tspan x="775" y="105.5">ntfy: notification</tspan></text>
  <rect class="shape blue" x="686" y="156" width="178" height="48" rx="6"/>
  <text x="775" y="173" text-anchor="middle">Deduplicate</text>
  <text x="775" y="187.5" text-anchor="middle" class="small muted">notification ID + address</text>
  <rect class="shape blue" x="686" y="240" width="178" height="48" rx="6"/>
  <text x="775" y="257" text-anchor="middle">Rate limit</text>
  <text x="775" y="271.5" text-anchor="middle" class="small muted">30, then 1 per 30 s</text>
  <path class="edge" d="M620,178 L640,178 L640,76 L686,76" marker-end="url(#arrow)"/>
  <path class="edge" d="M315,172 L315,300 L652,300 L652,106 L686,106" marker-end="url(#arrow)"/>
  <text x="470" y="318" text-anchor="middle" class="small muted">ntfy has one destination, so it needs no user node</text>
  <path class="edge" d="M775,126 L775,156" marker-end="url(#arrow)"/>
  <path class="edge" d="M775,204 L775,240" marker-end="url(#arrow)"/>
  <rect class="shape purple" x="686" y="345" width="178" height="40" rx="6"/>
  <text x="775" y="365" text-anchor="middle">SMS, email, ntfy topic</text>
  <path class="edge" d="M775,288 L775,345" marker-end="url(#arrow)"/>
</svg>
