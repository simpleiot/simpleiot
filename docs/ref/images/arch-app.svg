<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" role="img" aria-label="Simple IoT application architecture">
  <!-- Simple IoT diagram style: see docs/ref/documentation.md (Diagrams). -->
  <style>
  :root {
    --bg: #ffffff; --fg: #1f1f1f; --muted: #5f5f5f; --line: #3a3a3a;
    --blue: #dae8fc; --blue-s: #6c8ebf;
    --green: #d5e8d4; --green-s: #82b366;
    --yellow: #fff2cc; --yellow-s: #d6b656;
    --purple: #e1d5e7; --purple-s: #9673a6;
    --orange: #ffe6cc; --orange-s: #d79b00;
    --red: #f8cecc; --red-s: #b85450;
    --gray: #f5f5f5; --gray-s: #9a9a9a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --fg: #f0f0f0; --muted: #a8a8a8; --line: #c8c8c8;
      --blue: #1e2a3d; --green: #1f3320; --yellow: #38321c;
      --purple: #2f2538; --orange: #3d2a14; --red: #3d1f1f;
      --gray: #242424; --gray-s: #5a5a5a;
    }
  }
  svg { font-family: Inter, Helvetica, Arial, sans-serif; }
  .bg { fill: var(--bg); }
  text { fill: var(--fg); font-size: 12px; dominant-baseline: central; }
  .title { font-size: 14px; font-weight: 600; dominant-baseline: auto; }
  .small { font-size: 11px; }
  .muted { fill: var(--muted); }
  .bold { font-weight: 600; }
  .mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 11px; }
  .shape { stroke-width: 1.2; }
  .blue { fill: var(--blue); stroke: var(--blue-s); }
  .green { fill: var(--green); stroke: var(--green-s); }
  .yellow { fill: var(--yellow); stroke: var(--yellow-s); }
  .purple { fill: var(--purple); stroke: var(--purple-s); }
  .orange { fill: var(--orange); stroke: var(--orange-s); }
  .red { fill: var(--red); stroke: var(--red-s); }
  .gray { fill: var(--gray); stroke: var(--gray-s); }
  .dashed { stroke-dasharray: 5 4; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; }
  .edge.c-blue { stroke: var(--blue-s); }
  .edge.c-green { stroke: var(--green-s); }
  .edge.c-purple { stroke: var(--purple-s); }
  .edge.c-orange { stroke: var(--orange-s); }
  .edge.c-red { stroke: var(--red-s); }
  .head { fill: var(--line); }
  .head.c-blue { fill: var(--blue-s); }
  .head.c-green { fill: var(--green-s); }
  .head.c-purple { fill: var(--purple-s); }
  .head.c-orange { fill: var(--orange-s); }
  .head.c-red { fill: var(--red-s); }
  .actor { fill: none; stroke: var(--fg); stroke-width: 1.5; }
  .label-bg { fill: var(--bg); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-blue" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-green" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-purple" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-orange" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head c-red" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="860" height="460" rx="8"/>
  <rect class="shape gray" x="20" y="20" width="580" height="420" rx="10"/>
  <text class="title" x="32" y="42">📦 SIOT instance (one binary)</text>
  <rect class="shape blue" x="60" y="56" width="160" height="48" rx="6"/>
  <text x="140" y="73" text-anchor="middle">Store</text>
  <text x="140" y="87.5" text-anchor="middle" class="small muted">JetStream streams</text>
  <rect class="shape purple" x="300" y="56" width="160" height="48" rx="6"/>
  <text x="380" y="73" text-anchor="middle">NATS server</text>
  <text x="380" y="87.5" text-anchor="middle" class="small muted">embedded</text>
  <path class="edge" d="M220,80 L300,80" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect class="shape gray dashed" x="40" y="160" width="540" height="260" rx="10"/>
  <text class="title" x="52" y="182">🧩 Clients</text>
  <rect class="shape blue" x="60" y="196" width="114" height="40" rx="6"/>
  <text x="117" y="216" text-anchor="middle">Modbus</text>
  <rect class="shape blue" x="186" y="196" width="114" height="40" rx="6"/>
  <text x="243" y="216" text-anchor="middle">1-Wire</text>
  <rect class="shape blue" x="312" y="196" width="114" height="40" rx="6"/>
  <text x="369" y="216" text-anchor="middle">GPIO</text>
  <rect class="shape blue" x="438" y="196" width="114" height="40" rx="6"/>
  <text x="495" y="216" text-anchor="middle">CAN bus</text>
  <rect class="shape blue" x="60" y="250" width="114" height="40" rx="6"/>
  <text x="117" y="270" text-anchor="middle">Serial (MCU)</text>
  <rect class="shape blue" x="186" y="250" width="114" height="40" rx="6"/>
  <text x="243" y="270" text-anchor="middle">MQTT</text>
  <rect class="shape blue" x="312" y="250" width="114" height="40" rx="6"/>
  <text x="369" y="270" text-anchor="middle">Shelly</text>
  <rect class="shape blue" x="438" y="250" width="114" height="40" rx="6"/>
  <text x="495" y="270" text-anchor="middle">Particle</text>
  <rect class="shape blue" x="60" y="304" width="114" height="40" rx="6"/>
  <text x="117" y="324" text-anchor="middle">Rules</text>
  <rect class="shape blue" x="186" y="304" width="114" height="40" rx="6"/>
  <text x="243" y="324" text-anchor="middle">Database</text>
  <rect class="shape blue" x="312" y="304" width="114" height="40" rx="6"/>
  <text x="369" y="324" text-anchor="middle">Metrics</text>
  <rect class="shape blue" x="438" y="304" width="114" height="40" rx="6"/>
  <text x="495" y="324" text-anchor="middle">Sync</text>
  <rect class="shape blue" x="60" y="358" width="114" height="40" rx="6"/>
  <text x="117" y="378" text-anchor="middle">Messaging</text>
  <rect class="shape blue" x="186" y="358" width="114" height="40" rx="6"/>
  <text x="243" y="378" text-anchor="middle">Signal gen</text>
  <rect class="shape blue" x="312" y="358" width="114" height="40" rx="6"/>
  <text x="369" y="378" text-anchor="middle">HTTP API + UI</text>
  <rect class="shape blue dashed" x="438" y="358" width="114" height="40" rx="6"/>
  <text x="495" y="378" text-anchor="middle">Your client</text>
  <path class="edge" d="M380,104 L380,160" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect class="label-bg" x="359.39" y="123" width="41.22" height="18" rx="3"/>
  <text x="380" y="132" text-anchor="middle" class="small">points</text>
  <rect class="shape purple" x="660" y="56" width="180" height="48" rx="6"/>
  <text x="750" y="73" text-anchor="middle">External process</text>
  <text x="750" y="87.5" text-anchor="middle" class="small muted">any language, over NATS</text>
  <path class="edge" d="M460,80 L660,80" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect class="shape blue" x="660" y="300" width="180" height="48" rx="6"/>
  <text x="750" y="324" text-anchor="middle">Upstream SIOT instance</text>
  <path class="edge" d="M552,324 L660,324" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <rect class="label-bg" x="590.12" y="315" width="31.76" height="18" rx="3"/>
  <text x="606" y="324" text-anchor="middle" class="small">sync</text>
</svg>
