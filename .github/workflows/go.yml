name: Go
on: [push]
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # go.mod names the version; releases are built with the same one
          go-version-file: go.mod
        id: go

      - name: Set up nodejs
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
        id: node

      - name: Get dependencies
        run: |
          . envsetup.sh
          siot_install_frontend_deps

      - name: Test/lint frontend
        run: |
          . envsetup.sh
          siot_build_frontend
          siot_test_frontend

      - name: Test Backend
        run: |
          node --version
          . envsetup.sh
          go test -p=1 -race "$@" ./...

      - name: Check dependencies for known vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Lint backend
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned so CI matches the version developers run locally. Bump
          # this deliberately, along with any fixes new checks require.
          version: v2.13.2
          args: --timeout=5m
