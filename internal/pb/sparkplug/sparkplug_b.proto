syntax = "proto2";

package org.eclipse.tahu.protobuf;

option go_package = "internal/pb/sparkplug";

option java_package = "org.eclipse.tahu.protobuf";
option java_outer_classname = "SparkplugBProto";

message Payload {

  message Template {

    message Parameter {
      optional string name = 1;
      optional uint32 type = 2;

      oneof value {
        uint32 int_value = 3;
        uint64 long_value = 4;
        float float_value = 5;
        double double_value = 6;
        bool boolean_value = 7;
        string string_value = 8;
        ParameterValueExtension extension_value = 9;
      }

      message ParameterValueExtension {
        extensions 1 to max;
      }
    }

    // The version of the Template to prevent mismatches
    optional string version = 1;
    // Each metric is the name of the metric and the datatype of the metric but
    // does not contain a value
    repeated Metric metrics = 2;
    repeated Parameter parameters = 3;
    // MUST be a reference to a template definition if this is an instance
    // (i.e. the name of the template definition) - MUST be omitted for
    // template definitions
    optional string template_ref = 4;
    optional bool is_definition = 5;
    extensions 6 to max;
  }

  message DataSet {

    message DataSetValue {

      oneof value {
        uint32 int_value = 1;
        uint64 long_value = 2;
        float float_value = 3;
        double double_value = 4;
        bool boolean_value = 5;
        string string_value = 6;
        DataSetValueExtension extension_value = 7;
      }

      message DataSetValueExtension {
        extensions 1 to max;
      }
    }

    message Row {
      repeated DataSetValue elements = 1;
      // For third party extensions
      extensions 2 to max;
    }

    optional uint64 num_of_columns = 1;
    repeated string columns = 2;
    repeated uint32 types = 3;
    repeated Row rows = 4;
    // For third party extensions
    extensions 5 to max;
  }

  message PropertyValue {

    optional uint32 type = 1;
    optional bool is_null = 2;

    oneof value {
      uint32 int_value = 3;
      uint64 long_value = 4;
      float float_value = 5;
      double double_value = 6;
      bool boolean_value = 7;
      string string_value = 8;
      PropertySet propertyset_value = 9;
      // List of Property Values
      PropertySetList propertysets_value = 10;
      PropertyValueExtension extension_value = 11;
    }

    message PropertyValueExtension {
      extensions 1 to max;
    }
  }

  message PropertySet {
    // Names of the properties
    repeated string keys = 1;
    repeated PropertyValue values = 2;
    extensions 3 to max;
  }

  message PropertySetList {
    repeated PropertySet propertyset = 1;
    extensions 2 to max;
  }

  message MetaData {
    // Bytes specific metadata
    optional bool is_multi_part = 1;

    // General metadata
    // Content/Media type
    optional string content_type = 2;
    // File size, String size, Multi-part size, etc
    optional uint64 size = 3;
    // Sequence number for multi-part messages
    optional uint64 seq = 4;

    // File metadata
    // File name
    optional string file_name = 5;
    // File type (i.e. xml, json, txt, cpp, etc)
    optional string file_type = 6;
    // md5 of data
    optional string md5 = 7;

    // Catchalls and future expansion
    // Could be anything such as json or xml of custom properties
    optional string description = 8;
    extensions 9 to max;
  }

  message Metric {

    // Metric name - should only be included on birth
    optional string name = 1;
    // Metric alias - tied to name on birth and included in subsequent messages
    optional uint64 alias = 2;
    // Timestamp associated with data acquisition time
    optional uint64 timestamp = 3;
    // DataType of the metric/tag value
    optional uint32 datatype = 4;
    // If this is historical data and should not update real time tag
    optional bool is_historical = 5;
    // Tells consuming clients such as MQTT Engine to not store this as a tag
    optional bool is_transient = 6;
    // If this is null - explicitly say so rather than using -1, false, etc for
    // some datatypes.
    optional bool is_null = 7;
    // Metadata for the payload
    optional MetaData metadata = 8;
    optional PropertySet properties = 9;

    oneof value {
      uint32 int_value = 10;
      uint64 long_value = 11;
      float float_value = 12;
      double double_value = 13;
      bool boolean_value = 14;
      string string_value = 15;
      // Bytes, File
      bytes bytes_value = 16;
      DataSet dataset_value = 17;
      Template template_value = 18;
      MetricValueExtension extension_value = 19;
    }

    message MetricValueExtension {
      extensions 1 to max;
    }
  }

  // Timestamp at message sending time
  optional uint64 timestamp = 1;
  // Repeated forever - no limit in Google Protobufs
  repeated Metric metrics = 2;
  // Sequence number
  optional uint64 seq = 3;
  // UUID to track message type in terms of schema definitions
  optional string uuid = 4;
  // To optionally bypass the whole definition above
  optional bytes body = 5;
  // For third party extensions
  extensions 6 to max;
}
